name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to draft
        required: true
        default: v0.3.0

jobs:
  build:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            asset: Aethery-arm64-v8a.apk
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            asset: Aethery-armeabi-v7a.apk

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITEA_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITEA_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITEA_ENV"

      - name: Install bindgen dependency
        run: |
          apt-get update
          apt-get install -y libclang-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Aether core
        working-directory: core/aether
        run: cargo ndk -t ${{ matrix.abi }} --platform 26 build --release --lib

      - name: Stage Aether library
        run: |
          mkdir -p app/src/main/jniLibs/${{ matrix.abi }}
          cp core/aether/target/${{ matrix.rust_target }}/release/libaether.so app/src/main/jniLibs/${{ matrix.abi }}/libaether.so

      - name: Bundle sing-box core
        env:
          SING_BOX_VERSION: 1.13.12
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a) sing_box_arch=arm64 ;;
            armeabi-v7a) sing_box_arch=arm ;;
          esac
          mkdir -p "app/src/main/assets/cores/${{ matrix.abi }}"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-android-${sing_box_arch}.tar.gz" \
            | tar -xz --strip-components=1 -C "app/src/main/assets/cores/${{ matrix.abi }}"

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHERY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing AETHERY_RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethery-release.jks"

      - name: Build signed release APK
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          test -n "$AETHERY_KEYSTORE_PASSWORD" && test -n "$AETHERY_KEY_ALIAS" && test -n "$AETHERY_KEY_PASSWORD"
          ./gradlew :app:assembleRelease -PtargetAbi=${{ matrix.abi }} -PaetheryKeystore="$RUNNER_TEMP/aethery-release.jks"

      - name: Name release APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name "*${{ matrix.abi }}*release.apk" -print -quit)
          test -n "$apk"
          cp "$apk" "dist/${{ matrix.asset }}"

      - name: Upload APK for release job
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  draft-release:
    name: Create draft release
    if: gitea.event_name == 'workflow_dispatch' || startsWith(gitea.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v3
        with:
          path: dist
          merge-multiple: true

      - name: Create draft release and upload APKs
        env:
          AETHERY_RELEASE_TOKEN: ${{ secrets.AETHERY_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ gitea.event_name == 'workflow_dispatch' && inputs.tag || gitea.ref_name }}
          GITEA_SERVER_URL: ${{ gitea.server_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -eu
          test -n "$AETHERY_RELEASE_TOKEN"
          test -n "$RELEASE_TAG"
          test -n "$GITEA_SERVER_URL"
          test -n "$GITEA_REPOSITORY"
          release_json=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $AETHERY_RELEASE_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"tag_name\":\"$RELEASE_TAG\",\"target_commitish\":\"master\",\"name\":\"Aethery $RELEASE_TAG\",\"draft\":true,\"prerelease\":false}" \
            "$GITEA_SERVER_URL/api/v1/repos/$GITEA_REPOSITORY/releases")
          release_id=$(printf '%s' "$release_json" | sed -n 's/.*\"id\":\([0-9][0-9]*\).*/\1/p' | head -n 1)
          test -n "$release_id"
          for apk in dist/Aethery-arm64-v8a.apk dist/Aethery-armeabi-v7a.apk; do
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token $AETHERY_RELEASE_TOKEN" \
              --form "attachment=@$apk;type=application/vnd.android.package-archive" \
              "$GITEA_SERVER_URL/api/v1/repos/$GITEA_REPOSITORY/releases/$release_id/assets?name=$(basename "$apk")"
          done
