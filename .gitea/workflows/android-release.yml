name: Build Android APKs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to draft
        required: true
        type: string
        default: "v0.7.1"

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Create or find draft release
        id: create
        env:
          AETHERY_RELEASE_TOKEN: ${{ secrets.AETHERY_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ forgejo.event_name == 'workflow_dispatch' && inputs.tag || forgejo.ref_name }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
        run: |
          set -eu
          test -n "$AETHERY_RELEASE_TOKEN"
          test -n "$RELEASE_TAG"
          test -n "$FORGEJO_SERVER_URL"
          test -n "$FORGEJO_REPOSITORY"

          # Check if a release for this tag already exists
          existing=$(curl --silent --show-error \
            --header "Authorization: token $AETHERY_RELEASE_TOKEN" \
            "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/releases/tags/$RELEASE_TAG" \
            2>/dev/null || true)

          release_id=$(printf '%s' "$existing" | jq -r '.id // empty' 2>/dev/null || true)

          if [ -z "$release_id" ]; then
            release_json=$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: token $AETHERY_RELEASE_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"tag_name\":\"$RELEASE_TAG\",\"target_commitish\":\"master\",\"name\":\"Aethery $RELEASE_TAG\",\"draft\":true,\"prerelease\":false}" \
              "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/releases")
            release_id=$(printf '%s' "$release_json" | jq -r '.id')
          fi

          test -n "$release_id" && test "$release_id" != "null"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Created/found release $release_id for tag $RELEASE_TAG"

  build:
    name: Build ${{ matrix.abi }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust_target: aarch64-linux-android
            asset: Aethery-arm64-v8a.apk
          - abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            asset: Aethery-armeabi-v7a.apk
          - abi: x86_64
            rust_target: x86_64-linux-android
            asset: Aethery-x86_64.apk

    steps:
      - name: Check out source
        uses: https://github.com/actions/checkout@v4

      - name: Set up JDK 17
        uses: https://github.com/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: https://github.com/android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/3.22.1/bin" >> "$GITHUB_PATH"

      - name: Install bindgen dependency
        run: |
          apt-get update
          apt-get install -y libclang-dev

      - name: Set up Rust
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Aether core
        working-directory: core/aether
        run: cargo ndk -t ${{ matrix.abi }} --platform 26 build --release --lib

      - name: Stage Aether library
        run: |
          mkdir -p app/src/main/jniLibs/${{ matrix.abi }}
          cp core/aether/target/${{ matrix.rust_target }}/release/libaether.so app/src/main/jniLibs/${{ matrix.abi }}/libaether.so

      - name: Bundle sing-box core
        env:
          SING_BOX_VERSION: 1.13.12
        run: |
          case "${{ matrix.abi }}" in
            arm64-v8a) sing_box_arch=arm64 ;;
            armeabi-v7a) sing_box_arch=arm ;;
            x86_64) sing_box_arch=amd64 ;;
          esac
          mkdir -p "app/src/main/assets/cores/${{ matrix.abi }}"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-android-${sing_box_arch}.tar.gz" \
            | tar -xz --strip-components=1 -C "app/src/main/assets/cores/${{ matrix.abi }}"

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AETHERY_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing AETHERY_RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aethery-release.jks"

      - name: Build signed release APK
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          test -n "$AETHERY_KEYSTORE_PASSWORD" && test -n "$AETHERY_KEY_ALIAS" && test -n "$AETHERY_KEY_PASSWORD"
          ./gradlew :app:assembleRelease -PtargetAbi=${{ matrix.abi }} -PaetheryKeystore="$RUNNER_TEMP/aethery-release.jks"

      - name: Name release APK
        run: |
          mkdir -p dist
          apk=$(find app/build/outputs/apk/release -name "*${{ matrix.abi }}*release.apk" -print -quit)
          test -n "$apk"
          cp "$apk" "dist/${{ matrix.asset }}"

      - name: Upload APK to release
        env:
          AETHERY_RELEASE_TOKEN: ${{ secrets.AETHERY_RELEASE_TOKEN }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
        run: |
          set -eu
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: token $AETHERY_RELEASE_TOKEN" \
            --form "attachment=@dist/${{ matrix.asset }};type=application/vnd.android.package-archive" \
            "$FORGEJO_SERVER_URL/api/v1/repos/$FORGEJO_REPOSITORY/releases/${{ needs.create-release.outputs.release_id }}/assets?name=${{ matrix.asset }}"
