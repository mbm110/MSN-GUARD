name: Build MSN-GUARD Windows Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Build Tools (NASM & Perl for BoringSSL)
        run: |
          choco install nasm strawberryperl -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build Aether Core Executable
        run: |
          cd core/aether
          cargo build --release --bin aether

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-windows-x64
          path: target/release/aether.exe
