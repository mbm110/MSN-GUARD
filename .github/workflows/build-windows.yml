name: Build MSN-GUARD Windows GUI & Core

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Build Dependencies (NASM & Perl)
        run: |
          choco install nasm -y
          choco install strawberryperl -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Build Aether Core & GUI
        run: |
          cargo build --release --manifest-path core/aether/Cargo.toml --bin aether --bin aether-gui

      - name: Upload Windows Client Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MSN-GUARD-Windows-x64
          path: |
            **/release/aether.exe
            **/release/aether-gui.exe
          if-no-files-found: error
