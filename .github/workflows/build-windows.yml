name: Build MSN-GUARD Windows GUI & Core

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Build Dependencies (NASM & Perl)
        run: |
          choco install nasm -y
          choco install strawberryperl -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Download Wintun Driver DLL (For Windows Tun Mode)
        shell: pwsh
        run: |
          # 下载官方 Wintun 动态库 (Tun 虚拟网卡底层支持，解决 Windows 流量接管与直连失败问题)
          $wintunUrl = "https://www.wintun.net/builds/wintun-0.14.1.zip"
          $zipPath = "wintun.zip"
          Invoke-WebRequest -Uri $wintunUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "wintun_extracted" -Force
          
          # 创建 release 目录并把 wintun.dll 复制到与 aether.exe 同级的位置
          New-Item -ItemType Directory -Force -Path "core/aether/target/release"
          Copy-Item "wintun_extracted/wintun/bin/amd64/wintun.dll" "core/aether/target/release/wintun.dll"
          Write-Host "Wintun DLL placed successfully in release directory."

      - name: Build Aether Core & GUI
        run: |
          cargo build --release --manifest-path core/aether/Cargo.toml --bin aether --bin aether-gui

      - name: Prepare Release Bundle
        shell: pwsh
        run: |
          # 确保打包时将 wintun.dll 一并放入最终的产物目录中
          $releaseDir = "core/aether/target/release"
          if (Test-Path "$releaseDir/wintun.dll") {
              Write-Host "wintun.dll verified in release folder."
          } else {
              Write-Warning "wintun.dll missing from release folder!"
          }

      - name: Upload Windows Client Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MSN-GUARD-Windows-x64
          path: |
            core/aether/target/release/aether.exe
            core/aether/target/release/aether-gui.exe
            core/aether/target/release/wintun.dll
          if-no-files-found: error
