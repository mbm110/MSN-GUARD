name: Build MSN-GUARD macOS Intel App

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: List Repository Structure
        run: |
          echo "=== Root Directory ==="
          ls -la
          echo "=== Finding package.json ==="
          find . -name "package.json"

      - name: Install Frontend Dependencies & Build UI
        run: |
          # 自动寻找 package.json 所在的目录（排除 core 目录）
          PKG_PATH=$(find . -name "package.json" | grep -v "core/" | head -n 1)
          if [ -n "$PKG_PATH" ]; then
            UI_DIR=$(dirname "$PKG_PATH")
          else
            # 如果没找到，默认使用 app 目录
            UI_DIR="app"
          fi
          echo "Found UI directory: $UI_DIR"
          cd "$UI_DIR"
          
          if [ ! -f "package-lock.json" ] && [ ! -f "yarn.lock" ] && [ ! -f "pnpm-lock.yaml" ]; then
            npm install --package-lock-only || npm init -y
          fi
          npm install
          npm run build
          cd -

      - name: Build Tauri / Desktop App (Intel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAURI_CONF=$(find . -name "tauri.conf.json" | head -n 1)
          if [ -n "$TAURI_CONF" ]; then
            cd "$(dirname "$TAURI_CONF")/.."
          fi
          cargo tauri build --target x86_64-apple-darwin --release

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msn-guard-macos-intel-ui
          path: |
            **/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            **/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
