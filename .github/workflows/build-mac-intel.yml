name: Build MSN-GUARD macOS Intel App

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Install Frontend Dependencies & Build UI
        run: |
          cd ui
          npm install --package-lock-only || npm init -y
          npm install
          npm run build
          cd ..

      - name: Build Tauri / Desktop App (Intel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo tauri build --target x86_64-apple-darwin --release

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msn-guard-macos-intel-ui
          path: |
            ui/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            ui/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
