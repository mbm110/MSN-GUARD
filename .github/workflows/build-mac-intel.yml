name: Build MSN-GUARD macOS Intel Core

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Build aether CLI
        run: |
          cargo build --release --target x86_64-apple-darwin --manifest-path core/aether/Cargo.toml --bin aether

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos-intel
          path: "**/release/aether"
          if-no-files-found: error
