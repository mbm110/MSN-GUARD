name: Build MSN-GUARD macOS Intel App

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin

      - name: Check and Build Frontend UI (If exists)
        run: |
          echo "=== Searching for package.json ==="
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -n "$PKG_PATH" ]; then
            UI_DIR=$(dirname "$PKG_PATH")
            echo "Found frontend directory at: $UI_DIR"
            cd "$UI_DIR"
            
            if [ ! -f "package-lock.json" ] && [ ! -f "yarn.lock" ] && [ ! -f "pnpm-lock.yaml" ]; then
              npm install
            else
              npm ci || npm install
            fi
            
            if npm run | grep -q "build"; then
              npm run build
            fi
            cd -
          else
            echo "No package.json found. Skipping Node.js build step."
          fi

      - name: Build Desktop App / CLI (Intel)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "tauri.conf.json" ] || [ -d "src-tauri" ] || [ -f "ui/src-tauri/tauri.conf.json" ]; then
            TAURI_CONF=$(find . -name "tauri.conf.json" | head -n 1)
            if [ -n "$TAURI_CONF" ]; then
              cd "$(dirname "$TAURI_CONF")/.."
            fi
            cargo tauri build --target x86_64-apple-darwin --release
          else
            echo "Building via cargo (Intel)..."
            cargo build --release --target x86_64-apple-darwin --manifest-path core/aether/Cargo.toml --bin aether
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msn-guard-macos-intel-binary
          path: |
            core/aether/target/x86_64-apple-darwin/release/aether
            **/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            **/target/x86_64-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: error
