name: Lantern Android startup diagnostic
on:
  push:
    branches: [feature/lantern-prototype]
    paths:
      - '.github/workflows/lantern-startup.yml'
      - 'scripts/lantern-startup-smoke.py'
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Existing APK workflow run to exercise
        required: true
        default: '43667193358'
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          run-id: ${{ inputs.artifact_run || '43667193358' }}
          github-token: ${{ github.token }}
          path: diagnostic-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/lantern-startup-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lantern-android-startup-diagnostic
          path: lantern-startup-results.json
