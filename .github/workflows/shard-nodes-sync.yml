name: SHARD node mirror sync

# Keeps remote/shard-nodes.txt — the SHARD node pool mirror the app fetches
# (ShardSubscription.SUBSCRIPTION_URL) — current without a build or version
# bump. v1.8.7+ apps dial this URL, so editing the filter below reaches every
# one of them with no release.

# The source is patterniha's Free-Configs list: one vless/trojan URL per line.
# The mirror is a verbatim copy unless FILTER_NODES below is changed; it is
# our kill-switch for a node that goes rogue or dies fleet-wide.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shard-nodes-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror the publisher's node list
        run: |
          set -euo pipefail
          curl -sSfL --max-time 60 \
            "https://raw.githubusercontent.com/patterniha/Free-Configs/main/configs.txt" \
            -o remote/shard-nodes.txt
          # An empty or truncated fetch must never replace a good mirror.
          if ! grep -q '://\| @' remote/shard-nodes.txt; then
            echo "fetched list looks empty — keeping the previous mirror"
            git checkout -- remote/shard-nodes.txt 2>/dev/null || rm -f remote/shard-nodes.txt
            exit 1
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- remote/shard-nodes.txt; then
            echo "mirror unchanged"
            exit 0
          fi
          git config user.name "shard-nodes-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add remote/shard-nodes.txt
          git commit -m "remote: sync SHARD node mirror from Free-Configs"
          git push
