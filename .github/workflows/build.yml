name: Build Android APK

on:
  push:
    branches: [ master, shard-rewrite, feature/lantern-prototype ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # aether/Compose/KGP request a JDK 21 toolchain. foojay (the resolver
      # Gradle downloads JDKs from) no longer lists Temurin or JetBrains for 21
      # — its redirect answers 400 — so it cannot fetch one. Install 21 here
      # and let Gradle's auto-detect find it instead of downloading.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;26.3.11579264 cmake;3.22.1"
          accept-android-sdk-licenses: "true"

      # Radiance's novpn Android bridge is compiled into a separate AAR by
      # app/build.gradle.kts. Keep Go and gomobile pinned in the build script.
      - name: Set up Go for Lantern bridge
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Install Rust and targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup signing keystore
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          echo "$AETHERY_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.env <<EOF
          storePassword=$AETHERY_KEYSTORE_PASSWORD
          keyAlias=$AETHERY_KEY_ALIAS
          keyPassword=$AETHERY_KEY_PASSWORD
          EOF

      - name: Build hev-socks5-tunnel (ndk-build)
        run: |
          set -e
          NDK=$ANDROID_HOME/ndk/26.3.11579264
          if [ -d app/src/main/cpp/hev ]; then
            $NDK/ndk-build -C app/src/main/cpp/hev NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk -j$(nproc)
            echo "hev libs:"; ls -lh app/src/main/cpp/hev/libs/*/* 2>/dev/null || true
            for abi in arm64-v8a armeabi-v7a x86_64; do src="app/src/main/cpp/hev/libs/$abi/libhev-socks5-tunnel.so"; dst="app/src/main/jniLibs/$abi/libhev-socks5-tunnel.so"; if [ -f "$src" ]; then mkdir -p "app/src/main/jniLibs/$abi"; cp "$src" "$dst"; echo "vendored hev $abi $(stat -c%s "$dst") bytes"; else echo "WARN: hev $abi not built"; fi; done
          else
            echo "hev source not present - skipping (legacy engine only)"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
          MSN_IDENTITY_RELAY_HMAC: ${{ secrets.MSN_IDENTITY_RELAY_HMAC }}
          # foojay can no longer serve JDK 21, so stop Gradle trying to fetch
          # one and use the JDK installed above. auto-detect is Gradle's default.
          ORG_GRADLE_PROJECT_org.gradle.java.installations.auto-download: 'false'
        run: |
          test -n "$MSN_IDENTITY_RELAY_HMAC" || { echo 'MSN_IDENTITY_RELAY_HMAC secret is required for relay builds' >&2; exit 1; }
          # AGP's ABI splitter has been failing nondeterministically inside
          # IncrementalSplitterRunnable after compile/lint already passed.
          # Serialize packaging so split APK writers cannot race, and retain
          # the stacktrace if the packaging task itself fails again.
          ./gradlew --no-parallel --max-workers=1 --stacktrace testReleaseUnitTest assembleRelease -PaetheryKeystore=release.keystore

      - name: Verify APK signatures
        run: |
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$SIGNER" verify --verbose --print-certs "$apk" > "$apk.signing.txt"
            cat "$apk.signing.txt"
            "$SIGNER" verify --verbose --print-certs --min-sdk-version 23 --max-sdk-version 23 "$apk" > "$apk.v1.txt"
            grep -q "Verified using v1 scheme.*: true" "$apk.v1.txt"
            cat "$apk.v1.txt"
            for scheme in 2 3; do
              grep -q "Verified using v$scheme scheme.*: true" "$apk.signing.txt"
            done
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk

      - name: Upload ARM64 APK only
        uses: actions/upload-artifact@v4
        with:
          name: arm64-v8a-apk
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error