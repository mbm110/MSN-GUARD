name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Rust and targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Setup signing keystore
        env:
          AETHERY_KEYSTORE_BASE64: ${{ secrets.AETHERY_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: |
          echo "$AETHERY_KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.env <<EOF
          storePassword=$AETHERY_KEYSTORE_PASSWORD
          keyAlias=$AETHERY_KEY_ALIAS
          keyPassword=$AETHERY_KEY_PASSWORD
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download xray binary artifact
        uses: actions/download-artifact@v4
        with:
          name: libxray
          path: jniLibs-download

      - name: Copy xray binary to jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a
          cp jniLibs-download/arm64-v8a/libxray.so app/src/main/jniLibs/arm64-v8a/
          cp jniLibs-download/armeabi-v7a/libxray.so app/src/main/jniLibs/armeabi-v7a/
          ls -la app/src/main/jniLibs/*/

      - name: Build Release APKs
        env:
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.AETHERY_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.AETHERY_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.AETHERY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PaetheryKeystore=release.keystore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/release/*.apk