name: Build Windows Client

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Release or debug build"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches: [ master, shard-rewrite ]
    paths:
      - "core/aether/**"
      - "core/quiche/**"
      - ".github/workflows/build-windows-client.yml"

jobs:
  build-windows-client:
    runs-on: windows-latest
    permissions:
      contents: read

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install build dependencies
        run: |
          choco install cmake ninja -y --no-progress
          $cmakeBin = "${env:ProgramFiles}\CMake\bin"
          if (Test-Path $cmakeBin) {
            $env:Path += ";$cmakeBin"
            "$cmakeBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build Aether Windows CLI
        run: |
          cargo build --manifest-path core/aether/Cargo.toml --release --bin aether --features tor

      - name: Build Aether Windows GUI
        run: |
          cargo build --manifest-path core/aether/Cargo.toml --release --bin aether-gui --features tor

      - name: Prepare Windows package
        run: |
          $dist = "dist/windows-msn-guard"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "core/target/release/aether.exe" "$dist\aether.exe"
          Copy-Item "core/target/release/aether-gui.exe" "$dist\aether-gui.exe"

          $launcher = @'
          @echo off
          setlocal
          echo MSN-GUARD Windows Client
          echo.
          echo Starting Aether GUI...
          aether-gui.exe
          if errorlevel 1 (
            echo.
            echo Failed to start Aether GUI.
            echo Press any key to exit...
            pause >nul
          )
          exit /b %errorlevel%
          '@
          Set-Content -Path "$dist\start-msn-guard.cmd" -Encoding utf8 -Value $launcher

          $launcherNoGui = @'
          @echo off
          setlocal
          echo MSN-GUARD CLI launcher
          echo.
          echo Starting Aether CLI...
          aether.exe --help
          pause
          '@
          Set-Content -Path "$dist\run-aether-cli.cmd" -Encoding utf8 -Value $launcherNoGui

          $configJson = @'
          {
            "protocol": "shard",
            "masque_mode": "auto",
            "masque_http2": true,
            "masque_http3": true,
            "wireguard": true,
            "gool": false,
            "tor_mode": "off",
            "psiphon_mode": "off",
            "scan_mode": "verified",
            "noize_profile": "firewall",
            "ip_version": "4",
            "enable_shard": true,
            "shard_mode": "tls",
            "shard_size": 24,
            "shard_sleep_ms": 10,
            "prefer_iran_routes": false,
            "custom_sni": "",
            "custom_peer": "",
            "custom_inner_peer": "",
            "proxy_listen": "127.0.0.1:1819",
            "http_proxy_listen": "127.0.0.1:1820",
            "dns_proxy": "127.0.0.1:53",
            "system_proxy": true,
            "auto_reconnect": true,
            "quick_reconnect": true,
            "bypass_lan": false,
            "bypass_iran": false,
            "chain_mode": "none"
          }
          '@
          Set-Content -Path "$dist\msn-guard-config.example.json" -Encoding utf8 -Value $configJson

          $envExample = @'
          AETHER_PROTOCOL=shard
          AETHER_MASQUE_HTTP2=1
          AETHER_MASQUE_HTTP3=1
          AETHER_SHARD=1
          AETHER_SHARD_MODE=tls
          AETHER_SHARD_SIZE=24
          AETHER_SHARD_SLEEP=10
          AETHER_SCAN=verified
          AETHER_NOIZE=firewall
          AETHER_IP=4
          AETHER_SOCKS=127.0.0.1:1819
          AETHER_HTTP_PROXY=127.0.0.1:1820
          AETHER_QUICK_RECONNECT=1
          AETHER_AUTO_RECONNECT=1
          AETHER_SYSTEM_PROXY=1
          AETHER_GW_MODE=auto
          '@
          Set-Content -Path "$dist\msn-guard-env.example.txt" -Encoding utf8 -Value $envExample

          $readme = @'
          MSN-GUARD Windows Client

          Build output:
          - aether.exe
          - aether-gui.exe
          - start-msn-guard.cmd
          - msn-guard-config.example.json
          - msn-guard-env.example.txt

          Quick start:
          1. Double click start-msn-guard.cmd
          2. Or run:
             aether-gui.exe
             or
             aether.exe --help

          Supported profile knobs:
          - protocol: shard / masque / wg / gool / tor / psiphon
          - scan_mode: verified / balanced / turbo
          - noize_profile: firewall / stealth / custom
          - bind/socks ports: 127.0.0.1:1819, 127.0.0.1:1820
          - tunnel / chain / reconnect / system proxy
          '@
          Set-Content -Path "$dist\README.txt" -Encoding utf8 -Value $readme

          Compress-Archive -Path "$dist\*" -DestinationPath "windows-msn-guard.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msn-guard
          path: windows-msn-guard.zip
          if-no-files-found: error
